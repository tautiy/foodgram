server {
    listen 80;
    server_name 158.160.229.49 phudgrum.abrdns.com;
    return 301 https://$host$request_url;
}

server {
    listen 443 ssl;
    server_name 158.160.229.49 phudgrum.abrdns.com;

    ssl_certificate /etc/letsencrypt/live/phudgrum.abrdns.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phudgrum.abrdns.com/privkey.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }

    location /api/ {
        proxy_pass http://foodgram_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://foodgram_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
